<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藥局嗎？藥好了沒？ V2</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#173e3b;background:#edf0e7}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#1b6256;color:white;font-weight:700}button:hover{filter:brightness(1.13)}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #e99e35;outline-offset:3px}header{background:#173e3b;color:#fff;padding:20px 4%;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:24px;margin:5px 0}small{font-size:11px;letter-spacing:2px}.wrap{max-width:1400px;margin:auto;padding:22px}.stats,.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stats>div,.person{background:#fffdf7;border-radius:12px;padding:14px}.stats strong{font-size:26px;display:block}.people{grid-template-columns:repeat(3,1fr)}.person b{display:block}.person span{font-size:13px;color:#5f776d}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:#d5dfd2;border:7px solid #b7c8b8;border-radius:18px;padding:18px}.station{background:#fffdf5;color:#173e3b;text-align:left;min-height:155px;border:1px solid #b6c6b6;box-shadow:0 5px 0 #b6c6b6;padding:17px}.station .emoji{display:block;font-size:30px;margin-bottom:9px}.station b{font-size:18px;display:block}.station p{font-size:13px;line-height:1.6;font-weight:400;margin:7px 0 0}.station.alert{background:#ffedcc;border-color:#ce9957}.station.selected{outline:3px solid #246555}.aisle{grid-column:1/-1;text-align:center;font-size:13px;color:#50675d;padding:5px}.side{background:#fffdf7;border-radius:16px;padding:22px}h2{font-size:21px;margin:4px 0 16px}h3{font-size:15px}.hint{background:#edf2e7;padding:12px;line-height:1.7;font-size:14px;border-left:3px solid #52856d}.log{height:300px;overflow:auto;font-size:12px;line-height:1.7}.log p{border-bottom:1px solid #e3e8df;margin:0;padding:10px 0}.secondary{background:#e4ebe1;color:#214f43}.overlay{position:fixed;inset:0;background:#133a35d9;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{background:#fffdf7;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:22px;padding:30px;box-shadow:0 20px 80px #0005}.dialog h2{font-size:27px}.dialog p{line-height:1.8}.tag{font-size:11px;letter-spacing:2px;color:#42806b;margin-bottom:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.card{background:#edf2e7;border-radius:12px;padding:16px;margin:12px 0;line-height:1.8}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #d9e2d4;border-radius:10px}.row small{display:block;letter-spacing:0;color:#60776b;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#163e38;color:#fff;padding:15px 22px;border-radius:12px;z-index:15;max-width:90vw;pointer-events:none;box-shadow:0 6px 25px #0003}.hidden{display:none!important}.bags{display:flex;flex-wrap:wrap;gap:8px}.bags span{background:#e2e8dd;border-radius:8px;padding:10px}.bags .ok{background:#c5e2c8}footer{font-size:12px;line-height:1.8;color:#687d70;padding:18px 0}.progress{height:7px;background:#dae3d6;border-radius:6px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:#327b66}label{font-size:14px;line-height:2}select{font:inherit;padding:7px;border-radius:6px;border:1px solid #b6c7b6}@media(max-width:1000px){.layout{grid-template-columns:1fr}.log{height:150px}}@media(max-width:620px){.wrap{padding:10px}.floor{grid-template-columns:1fr 1fr;padding:10px;gap:10px}.station{min-height:145px;padding:12px}.stats{gap:5px}.stats>div{padding:8px;font-size:12px}.stats strong{font-size:21px}.people{gap:5px}.person{padding:10px;font-size:13px}.dialog{padding:22px}.row{align-items:flex-start;flex-direction:column}h1{font-size:20px}}
</style></head><body><header><div><small>HOSPITAL PHARMACY / V2</small><h1>藥局嗎？藥好了沒？</h1></div><button id="pause" class="secondary">暫停</button></header><div class="wrap"><section class="stats"><div>值班時間<strong id="clock">14:00</strong></div><div>現場人力<strong id="staff">3 人</strong></div><div>全流程待辦<strong id="pending">0</strong></div><div>已完成<strong id="done">0</strong></div></section><section class="people"><div class="person"><b>🧑‍⚕️ 你 · 固定作藥</b><span id="player">目前在：中央走道</span></div><div class="person"><b>👩‍⚕️ 同事 A · 固定核對</b><span id="checker">等待核對處方</span></div><div class="person"><b>👨‍⚕️ 同事 B · 固定發藥</b><span id="dispenser">等待發藥</span></div></section><div class="layout"><section class="floor" id="floor"></section><aside class="side"><h2>假日下午的藥局</h2><div class="hint" id="hint">兩台印表機，各自出單。先到急診工作檯或住院工作檯作藥。</div><div class="progress"><i id="progress"></i></div><h3>現場動態</h3><div class="log" id="log" aria-live="polite"></div><div class="actions"><button id="guide" class="secondary">流程說明</button><button id="end" class="secondary">整理交班</button></div></aside></div><footer>V2 可玩流程原型 · 獨立製作，未使用其他遊戲程式或素材。虛構處方與藥品，非臨床指引。<br>操作提示：你負責作藥；同事自動核對與發藥。點選其他站可查看進度。對話時暫停，關閉後現場繼續運作。重整會開始新的一局。</footer></div><div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div><div class="toast hidden" id="toast" role="status"></div><script>
'use strict';
const $=id=>document.getElementById(id);
const stations=[['ed','🖨️','急診工作檯'],['ip','🖨️','住院工作檯'],['grind','🥣','磨粉分包區'],['check','🔎','核對工作檯'],['dispense','🔢','發藥台與叫號機'],['cabinets','🗄️','護理站櫃位'],['adc','🖥️','ADC 審核站'],['window','🪟','慢箋領藥窗口'],['phone','☎️','藥局電話']];
let state=null, interval=null,toastTimer=null;
function pad(n){return String(n).padStart(3,'0')}
function time(){const m=840+Math.floor((state?.t||0)/3);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
function note(text){state.logs.unshift(time()+'　'+text);state.logs=state.logs.slice(0,60)}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function button(text,fn,secondary=false){const b=document.createElement('button');b.textContent=text;b.type='button';if(secondary)b.className='secondary';b.addEventListener('click',fn);return b}
function modal(title,html,actions=[],canClose=true){state.modal=true;const d=$('dialog');d.replaceChildren();const tag=document.createElement('div');tag.className='tag';tag.textContent='PHARMACY SHIFT / V2';d.append(tag);const h=document.createElement('h2');h.textContent=title;d.append(h);const body=document.createElement('div');body.innerHTML=html;d.append(body);const a=document.createElement('div');a.className='actions';actions.forEach(x=>a.append(button(...x)));if(canClose)a.append(button('回到藥局，繼續計時',close,true));d.append(a);$('overlay').classList.remove('hidden')}
function close(){state.modal=false;$('overlay').classList.add('hidden');render()}
function list(title,html,items){modal(title,html);const box=document.createElement('div');box.className='list';items.forEach(item=>{const row=document.createElement('div');row.className='row';const text=document.createElement('div');text.innerHTML='<b>'+item.label+'</b><small>'+item.detail+'</small>';row.append(text);if(item.action)row.append(button(item.action,item.fn));box.append(row)});$('dialog').insertBefore(box,$('dialog').lastElementChild)}
function add(kind,count=1,bags=0){for(let i=0;i<count;i++){const id=++state.serial;state.rx.push({id,kind,bags:i===0?bags:0,completedBags:0,sub:0,confirmed:false,prepared:false,stage:kind==='adc'?'adc':'new',ward:['3A','5B','7A'][id%3],calledAt:null,patientAt:null})}}
function pending(stage){return state.rx.filter(r=>r.stage===stage)}
function label(r){return (r.kind==='ip'?'住院':r.kind==='adc'?'ADC':'急診')+' #'+pad(r.id)}
function init(mode='practice'){clearInterval(interval);state={t:0,mode,modal:false,ended:false,serial:0,rx:[],done:0,adcDone:0,calls:0,call:null,logs:[],position:'中央走道',busy:0,walkTarget:null,checking:null,checkTicks:0,dispensing:null,dispenseTicks:0,away:0,visitor:false,windowStage:'none',bursted:false,mistakes:0};add('ed',1,1);add('ip',2);add('ed',1,4);add('adc');note('三人接班：你作藥，同事 A 核對，同事 B 發藥。');close();interval=setInterval(tick,1000)}
function visit(key){if(!state||state.ended)return;if(state.busy){toast('正在走向 '+state.walkTarget+'，請稍候。');return}const name=stations.find(x=>x[0]===key)[2];if(state.position===name){openStation(key);return}state.position='走動中';state.busy=2;state.walkTarget=name;state.walkKey=key;toast('走向'+name+'（2 秒）');render()}
function tick(){if(!state||state.modal||state.ended)return;state.t++;if(state.busy&&--state.busy===0){state.position=state.walkTarget;state.walkTarget=null;render();openStation(state.walkKey);return}
if(state.away>0&&--state.away===0){state.windowStage='returned';note('同事 B 調藥回來：窗口待點收核對，發藥工作恢復。');toast('調藥回來了，請處理慢箋窗口。')}
if(!state.checking){const r=pending('check')[0];if(r){state.checking=r.id;state.checkTicks=0}}
if(state.checking&&++state.checkTicks>=7){const r=state.rx.find(x=>x.id===state.checking);if(r.kind==='ip'){r.stage='sort';note(label(r)+' 核對完成，待放入 '+r.ward+' 護理站櫃位。')}else{r.stage='ready';note(label(r)+' 核對完成，移至發藥台旁待叫號。')}state.checking=null;state.checkTicks=0}
if(!state.away){if(!state.dispensing){const r=pending('arrived')[0];if(r){state.dispensing=r.id;state.dispenseTicks=0}}if(state.dispensing&&++state.dispenseTicks>=5){const r=state.rx.find(x=>x.id===state.dispensing);r.stage='done';state.done++;note(label(r)+' 病人完成領藥。');state.dispensing=null;state.dispenseTicks=0}}
state.rx.filter(r=>r.stage==='called'&&state.t>=r.patientAt).forEach(r=>{r.stage='arrived';note(label(r)+' 病人已到發藥台，等待同事 B 發藥。')});
if(state.t===18){state.visitor=true;state.windowStage='waiting';note('窗口出現慢箋領藥民眾：「我只有今天有空。」')}
if(state.t===38){state.call='護理站追藥';note('電話響了：護理站詢問處方進度。')}
if(state.t===70){add('ip',12);add('ed',10);state.bursted=true;note('兩台印表機同時出單：住院 12 張、急診 10 張。');toast('處方集中湧入：共 22 張')}
if(state.t>70&&state.t%65===0){add('ed',1,1+((state.t/65)%5));add('ip',2);add('adc');note('新處方送達：兒科磨粉、住院與 ADC 審核。')}
if(state.t%47===0&&!state.call){state.call=['總機轉錯電話','民眾用藥諮詢','護理站追藥'][Math.floor(state.t/47)%3];note('來電：'+state.call)}render();if(state.mode==='shift'&&state.t>=360)finish()}
function render(){if(!state)return;const unfinished=state.rx.filter(r=>r.stage!=='done').length;$('clock').textContent=time();$('staff').textContent=state.away?'2 人':'3 人';$('pending').textContent=unfinished+' 筆';$('done').textContent=state.done+' 筆';$('player').textContent='目前在：'+state.position;$('checker').textContent=state.checking?'核對中 #'+pad(state.checking)+'（'+state.checkTicks+'/7 秒）':'等待核對處方';$('dispenser').textContent=state.away?'外出調藥，剩 '+state.away+' 秒':state.dispensing?'發藥中 #'+pad(state.dispensing):'固定發藥，等待病人';$('progress').style.width=Math.min(100,state.t/360*100)+'%';$('hint').textContent=state.mode==='practice'?'自由試玩：不限時間。對話關閉後，同事才會繼續核對與發藥。':'正式班次：6 分鐘。對話時暫停，回到現場後時間繼續。';
const text={ed:'獨立印表機 · 待作藥 '+state.rx.filter(r=>r.kind==='ed'&&['new','grinding','prepared'].includes(r.stage)).length+' 張',ip:'獨立印表機 · 待作藥 '+state.rx.filter(r=>r.kind==='ip'&&['new','prepared'].includes(r.stage)).length+' 張',grind:'待磨粉 '+pending('grinding').length+' 張 · 每張種數不同',check:'同事 A · 待核對 '+pending('check').length+' 張',dispense:'待叫號 '+pending('ready').length+'｜等病人 '+pending('called').length+'｜待發 '+pending('arrived').length,cabinets:'待分類 '+pending('sort').length+' 張 · 3A／5B／7A',adc:'遠端藥櫃 · 待審核 '+pending('adc').length+' 筆',window:state.windowStage==='waiting'?'慢箋領藥：現場藥品不足':state.windowStage==='transit'?'同事外出調藥中':state.windowStage==='returned'?'藥已調回，待點收核對':state.windowStage==='done'?'已確認領藥安排':'告示：假日不提供慢箋領藥',phone:state.call?'來電中：'+state.call:'目前沒有來電'};
const floor=$('floor');floor.replaceChildren();stations.forEach(([key,emoji,name],i)=>{const b=button('',()=>visit(key));b.className='station';if((key==='phone'&&state.call)||(key==='window'&&['waiting','returned'].includes(state.windowStage))||(key==='adc'&&pending('adc').length))b.classList.add('alert');if(state.position===name)b.classList.add('selected');b.innerHTML='<span class="emoji">'+emoji+'</span><b>'+name+'</b><p>'+text[key]+'</p>';floor.append(b);if(i===2){const aisle=document.createElement('div');aisle.className='aisle';aisle.textContent='✚ 作藥 → 同事 A 核對 → 急診叫號發藥／住院分類入櫃';floor.append(aisle)}});$('log').replaceChildren();state.logs.forEach(x=>{const p=document.createElement('p');p.textContent=x;$('log').append(p)})}
function openStation(key){({ed:()=>desk('ed'),ip:()=>desk('ip'),grind:grindList,check:checkList,dispense:dispenseList,cabinets:cabinets,adc:adcList,window:windowTask,phone:phone})[key]()}
function desk(kind){const jobs=state.rx.filter(r=>r.kind===kind&&['new','grinding','prepared'].includes(r.stage));list(kind==='ed'?'急診工作檯 · 急診印表機':'住院工作檯 · 住院印表機','<p>每張有獨立編號與進度。作藥完成後送交同事 A 核對。</p>',jobs.map(r=>({label:label(r),detail:r.stage==='grinding'?'待磨粉 '+r.completedBags+'/'+r.bags+' 袋':r.stage==='prepared'?'作藥完成，待送核對':r.bags?'兒科特殊處理 · 需磨粉 '+r.bags+' 種':'一般處方'+(kind==='ip'?' · '+r.ward+' 護理站':''),action:'處理這張',fn:()=>prepare(r.id)})));if(!jobs.length)toast('這個工作檯目前沒有待作藥處方。')}
function prepare(id){const r=state.rx.find(x=>x.id===id);if(r.stage==='grinding'){grindJob(id);return}if(r.stage==='prepared'){modal(label(r)+' · 作藥完成','<p>送到核對工作檯後，從這個工作檯移除。核對由同事 A 接續。</p>',[['送交核對',()=>{r.stage='check';note(label(r)+' 已送交同事 A 核對。');toast(label(r)+' 已送交核對');desk(r.kind);render()}]]);return}modal(label(r)+' · 處方確認','<div class="card">'+(r.bags?'兒科處方：本張需磨粉 '+r.bags+' 種，各自一袋。':'一般'+(r.kind==='ip'?'住院':'急診')+'處方。')+'</div><p>確認處方資料與處理需求。此原型不使用真實藥名、劑量或臨床決策。</p>',[[r.bags?'確認後送磨粉區':'完成作藥',()=>{r.confirmed=true;r.stage=r.bags?'grinding':'prepared';note(label(r)+(r.bags?' 送磨粉區，共 '+r.bags+' 袋。':' 作藥完成，待送核對。'));toast(r.bags?'已送磨粉區，請到磨粉分包區':'作藥完成，接著送交核對');desk(r.kind);render()}]])}
function grindList(){const jobs=pending('grinding');list('磨粉分包區','<p>每張處方的藥品數量各自記錄。一藥一袋，切換工作後保留進度。</p>',jobs.map(r=>({label:label(r),detail:'已完成 '+r.completedBags+'／'+r.bags+' 袋',action:'接續磨粉',fn:()=>grindJob(r.id)})));if(!jobs.length)toast('尚無磨粉待辦：先到急診工作檯確認兒科處方。')}
function grindJob(id){const r=state.rx.find(x=>x.id===id);if(r.completedBags>=r.bags){r.stage='prepared';prepare(id);return}const steps=['完成這種藥的磨粉與分包','完成本袋標示','完成清潔與確認'];modal(label(r)+' · 第 '+(r.completedBags+1)+'／'+r.bags+' 袋','<div class="bags">'+Array.from({length:r.bags},(_,i)=>'<span class="'+(i<r.completedBags?'ok':'')+'">'+(i<r.completedBags?'✓':'○')+' 第 '+(i+1)+' 袋</span>').join('')+'</div><p>目前步驟：'+steps[r.sub]+'</p>',[[steps[r.sub],()=>{r.sub++;if(r.sub===3){r.sub=0;r.completedBags++;note(label(r)+' 第 '+r.completedBags+' 袋完成。')}if(r.completedBags===r.bags){r.stage='prepared';toast('本張 '+r.bags+' 袋完成，請送交核對');prepare(id)}else{grindJob(id);toast('進度已更新：'+r.completedBags+'/'+r.bags+' 袋')}render()}]])}
function checkList(){list('核對工作檯 · 同事 A','<p>同事 A 固定核對，對話關閉後自動作業。每張約 7 秒。急診核對後移至發藥台旁；住院核對後等待分類入櫃。</p>',pending('check').map(r=>({label:label(r),detail:r.id===state.checking?'同事 A 核對中':'排隊等待核對'})))}
function dispenseList(){const jobs=state.rx.filter(r=>['ready','called','arrived'].includes(r.stage));list('急診發藥台 · 叫號機','<p>核對完成的急診藥放在台旁。按叫號後等待病人到場，同事 B 再完成發藥。此原型由你操作叫號作為教學互動。</p>',jobs.map(r=>({label:label(r),detail:r.stage==='ready'?'核對完成，待叫號':r.stage==='called'?'已叫號，等待病人到場':state.away?'病人已到；同事 B 外出，等待恢復發藥':'病人已到，同事 B 依序發藥',action:r.stage==='ready'?'按叫號機':null,fn:()=>{r.stage='called';r.calledAt=state.t;r.patientAt=state.t+8;note(label(r)+' 已叫號，等待病人來領。');toast('已叫號：'+pad(r.id));dispenseList();render()}})))}
function cabinets(){list('住院藥品 · 護理站櫃位','<p>住院處方核對完成後，依護理站分類入櫃；不進入急診叫號流程。此原型由你操作入櫃。</p>',pending('sort').map(r=>({label:label(r),detail:'應放入 '+r.ward+' 護理站櫃位',action:'選擇櫃位',fn:()=>modal(label(r)+' · 分類入櫃','<div class="card">處方護理站：'+r.ward+'</div>', ['3A','5B','7A'].map(ward=>[ward+' 護理站',()=>{if(ward!==r.ward){state.mistakes++;toast('櫃位不符，請再確認護理站');return}r.stage='done';state.done++;note(label(r)+' 已放入 '+ward+' 護理站櫃位。');toast('住院處方分類完成');cabinets();render()}]))})))}
function adcList(){list('ADC · 遠端藥櫃審核站','<p>藥師在這裡審核處方，核可後急診室即可開櫃取藥。核可即完成藥局端工作，不進作藥、核對或發藥隊列。</p>',pending('adc').map(r=>({label:label(r),detail:'待藥師審核',action:'查看並審核',fn:()=>modal(label(r)+' · 遠端審核','<p>本範例設定：處方資訊完整，已完成必要確認，可核可。若需釐清，則保留待審。</p>',[['確認完成，核可處方',()=>{r.stage='done';state.done++;state.adcDone++;note(label(r)+' 核可完成，急診室可取藥，藥局端結案。');toast('ADC 核可完成，急診室可開櫃取藥');adcList();render()}],['待釐清，保留待審',()=>{note(label(r)+' 保留待審，待補充確認。');close()},true]])})))}
function windowTask(){const stage=state.windowStage;if(stage==='none'||stage==='done'){modal('慢箋領藥窗口','<p>'+(stage==='done'?'已完成本次領藥安排。':'告示：假日不提供慢箋領藥。目前沒有等候民眾。')+'</p>');return}if(stage==='transit'){modal('同事 B 外出調藥中','<p>現場目前 2 人。同事 A 繼續核對，發藥人力暫時缺席；已到場的急診病人仍在等待。</p>');return}if(stage==='returned'){modal('藥品已調回','<p>完成本次點收及領藥核對。此處將細節簡化為一次操作。</p>',[['完成核對與領藥安排',()=>{state.windowStage='done';note('慢箋窗口：點收核對與領藥安排完成。');toast('窗口事件完成');close()}]]);return}modal('「我只有假日能來。」','<p>你確認領藥安排、說明假日服務，發現現場藥品不足。</p><div class="card">若協調外出調藥，本次由同事 B 支援 45 秒。發藥工作會暫停，待領病人可能增加。</div>',[['協調同事 B 外出調藥',()=>{state.windowStage='transit';state.away=45;note('同事 B 外出調藥，發藥工作暫停。');close()}],['確認後續安排並記錄',()=>{state.windowStage='done';note('與民眾確認後續領藥安排，留下紀錄。');close()},true]])}
function phone(){if(!state.call){modal('電話暫時安靜','<p>趁現在接續手上的作業。</p>');return}const call=state.call;modal('☎ '+call,'<p>'+({'護理站追藥':'護理站：「藥好了嗎？」確認識別資訊後，查詢目前處方階段再回覆。','總機轉錯電話':'民眾：「請問明天門診幾點開始？」總機又把詢問轉進藥局。','民眾用藥諮詢':'先釐清詢問內容及必要背景，再安排適當回覆。'}[call])+'</p><p>手上每張處方與每一袋磨粉的進度都會保留。</p>',[['確認資訊並完成回覆／轉介',()=>{state.calls++;state.call=null;note('已處理來電：'+call);toast('電話處理完成');close()}]])}
function guide(){modal('V2 流程說明','<div class="card">急診：急診印表機 → 作藥／磨粉 → 同事 A 核對 → 發藥台旁 → 叫號 → 病人到場 → 同事 B 發藥。<br><br>住院：住院印表機 → 作藥 → 同事 A 核對 → 依護理站分類入櫃。<br><br>ADC：走到指定審核站 → 藥師核可 → 急診室可開櫃取藥，藥局端結案。</div><p>你固定作藥，同事 A 固定核對，同事 B 固定發藥。原型另開放你操作叫號與分類，方便檢視流程。磨粉種數依每張處方不同。</p><p>同事在你關閉對話後才繼續工作。每個步驟完成會立即更新；尚未送交的處方會保留在原工作檯。</p>')}
function finish(){state.ended=true;clearInterval(interval);const counts={};state.rx.filter(r=>r.stage!=='done').forEach(r=>counts[r.stage]=(counts[r.stage]||0)+1);const names={new:'待作藥',grinding:'磨粉中',prepared:'作藥完成待送核對',check:'待核對／核對中',sort:'住院待分類',ready:'急診待叫號',called:'等待病人',arrived:'等待發藥',adc:'ADC 待審核'};modal('值班結束，整理交班','<div class="card">完成 '+state.done+' 筆（含 ADC '+state.adcDone+' 筆）<br>已處理電話 '+state.calls+' 通<br>櫃位選錯提醒 '+state.mistakes+' 次</div><h3>待辦交班</h3><p>'+Object.entries(counts).map(([k,v])=>names[k]+'：'+v+' 筆').join('<br>')+'</p><p>窗口：'+({none:'無待辦',waiting:'慢箋領藥待協調',transit:'同事 B 外出調藥中',returned:'藥品已回，待點收核對',done:'已完成安排'}[state.windowStage])+'<br>電話：'+(state.call||'無待辦')+'</p><p>磨粉進度：'+(pending('grinding').map(r=>label(r)+' '+r.completedBags+'/'+r.bags+' 袋，當袋步驟 '+(r.sub+1)).join('；')||'無進行中')+'</p>',[['重新自由試玩',()=>init('practice')],['開始正式班次',()=>init('shift')]],false);render()}
$('pause').addEventListener('click',()=>{if(!state.ended)modal('暫停值班','<p>處方、走動與同事作業均已暫停。</p>')});$('guide').addEventListener('click',guide);$('end').addEventListener('click',()=>modal('整理交班？','<p>結算所有未完成處方、磨粉、電話與調藥事項。</p>',[['結束並整理交班',finish]]));state={modal:true,ended:true,t:0};modal('V2 · 三人值班，兩台印表機','<p>你固定作藥，同事 A 核對，同事 B 發藥。<br>急診與住院各自出單，磨粉每張種數不同。</p><div class="card">從自由試玩開始：不限時間，先有 1 種與 4 種磨粉處方、住院處方及 ADC 待審。<br>切換區域需要 2 秒，對話時暫停；關閉對話讓同事繼續工作。</div><p>正式班次約 6 分鐘，包含處方湧入、慢箋缺藥與電話事件。</p>',[['自由試玩（不限時）',()=>init('practice')],['正式值班（6 分鐘）',()=>init('shift')]],false);
</script></body></html>
